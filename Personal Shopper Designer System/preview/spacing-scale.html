<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
<div style="display:flex;align-items:flex-end;gap:10px">
  <div class="col" style="align-items:center"><div style="width:4px;height:4px;background:var(--gold)"></div><div class="val">1·4</div></div>
  <div class="col" style="align-items:center"><div style="width:8px;height:8px;background:var(--gold)"></div><div class="val">2·8</div></div>
  <div class="col" style="align-items:center"><div style="width:12px;height:12px;background:var(--gold)"></div><div class="val">3·12</div></div>
  <div class="col" style="align-items:center"><div style="width:16px;height:16px;background:var(--gold)"></div><div class="val">4·16</div></div>
  <div class="col" style="align-items:center"><div style="width:24px;height:24px;background:var(--gold)"></div><div class="val">6·24</div></div>
  <div class="col" style="align-items:center"><div style="width:32px;height:32px;background:var(--gold)"></div><div class="val">8·32</div></div>
  <div class="col" style="align-items:center"><div style="width:48px;height:48px;background:var(--gold)"></div><div class="val">12·48</div></div>
  <div class="col" style="align-items:center"><div style="width:64px;height:64px;background:var(--gold)"></div><div class="val">16·64</div></div>
</div>
<div style="margin-top:16px;font-family:var(--font-body);font-size:13px;color:var(--ink-3)">4px base scale. Cards pad 24–32px; marketing sections breathe at 64–96px.</div>
</body></html>
