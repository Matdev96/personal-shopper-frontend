<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>body{background:var(--surface-2)}</style></head>
<body>
<div class="row" style="gap:26px">
  <div class="col" style="align-items:center"><div style="width:100px;height:72px;background:#fff;border-radius:10px;box-shadow:var(--shadow-xs)"></div><div class="val">xs</div></div>
  <div class="col" style="align-items:center"><div style="width:100px;height:72px;background:#fff;border-radius:10px;box-shadow:var(--shadow-sm)"></div><div class="val">sm</div></div>
  <div class="col" style="align-items:center"><div style="width:100px;height:72px;background:#fff;border-radius:10px;box-shadow:var(--shadow-md)"></div><div class="val">md · card</div></div>
  <div class="col" style="align-items:center"><div style="width:100px;height:72px;background:#fff;border-radius:10px;box-shadow:var(--shadow-lg)"></div><div class="val">lg · hover</div></div>
  <div class="col" style="align-items:center"><div style="width:100px;height:72px;background:var(--gold);border-radius:10px;box-shadow:var(--shadow-gold)"></div><div class="val">gold glow</div></div>
</div>
<div style="margin-top:16px;font-family:var(--font-body);font-size:13px;color:var(--ink-3)">Warm-tinted shadows (charcoal alpha). Gold glow reserved for the primary CTA on hover.</div>
</body></html>
