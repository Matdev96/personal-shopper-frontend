<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row">
  <div class="col" style="flex:1"><div style="height:80px;border-radius:8px;background:var(--rose-wash)"></div><div class="val">--rose-wash</div></div>
  <div class="col" style="flex:1"><div style="height:80px;border-radius:8px;background:var(--rose-soft)"></div><div class="val">--rose-soft</div></div>
  <div class="col" style="flex:1"><div style="height:80px;border-radius:8px;background:var(--rose)"></div><div class="val">--rose</div></div>
  <div class="col" style="flex:1"><div style="height:80px;border-radius:8px;background:var(--rose-deep)"></div><div class="val">--rose-deep</div></div>
  <div class="col" style="flex:1"><div style="height:80px;border-radius:8px;background:var(--bg);border:1px solid var(--line)"></div><div class="val">--bg page</div></div>
</div>
<div style="margin-top:14px;font-family:var(--font-body);font-size:13px;color:var(--ink-3)">Rose-beige ramp — section bands, hero backdrops, alternating rhythm, the warm page wash.</div>
</body></html>
