<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row">
  <div class="col" style="flex:1">
    <div style="height:96px;border-radius:10px;background:var(--gold);box-shadow:var(--shadow-sm)"></div>
    <div class="lbl">Gold · Primary</div><div class="val">#dba938</div>
  </div>
  <div class="col" style="flex:1">
    <div style="height:96px;border-radius:10px;background:var(--rose)"></div>
    <div class="lbl">Rose Beige</div><div class="val">#e5cec4</div>
  </div>
  <div class="col" style="flex:1">
    <div style="height:96px;border-radius:10px;background:var(--charcoal)"></div>
    <div class="lbl">Charcoal · Ink</div><div class="val">#343233</div>
  </div>
  <div class="col" style="flex:1">
    <div style="height:96px;border-radius:10px;background:var(--white);border:1px solid var(--line)"></div>
    <div class="lbl">White · Surface</div><div class="val">#ffffff</div>
  </div>
</div>
</body></html>
