<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row" style="gap:36px">
  <div class="col" style="flex:1;gap:4px">
    <div class="lbl" style="color:var(--gold-deep)">Display · Headings</div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;color:var(--ink-1)">Playfair</div>
    <div style="font-family:var(--font-display);font-size:17px;color:var(--ink-2)">Aa Bb Cc · 0123456789</div>
    <div style="font-family:var(--font-display);font-style:italic;font-size:17px;color:var(--ink-3)">elegant italic accents</div>
    <div class="val" style="margin-top:4px">Playfair Display · 400–800 + italic</div>
  </div>
  <div style="width:1px;background:var(--line)"></div>
  <div class="col" style="flex:1;gap:4px">
    <div class="lbl" style="color:var(--gold-deep)">Body · UI</div>
    <div style="font-family:var(--font-body);font-weight:700;font-size:34px;line-height:1.05;color:var(--ink-1)">Inter</div>
    <div style="font-family:var(--font-body);font-size:15px;color:var(--ink-2)">Aa Bb Cc · 0123456789</div>
    <div style="font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--ink-3)">Buttons, labels, captions</div>
    <div class="val" style="margin-top:4px">Inter / DM Sans · 400–700</div>
  </div>
</div>
</body></html>
