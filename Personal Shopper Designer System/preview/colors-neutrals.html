<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row">
  <div class="col" style="flex:1"><div style="height:72px;border-radius:8px;background:var(--ink-1)"></div><div class="val">ink-1 #343233</div></div>
  <div class="col" style="flex:1"><div style="height:72px;border-radius:8px;background:var(--ink-2)"></div><div class="val">ink-2 #5c5859</div></div>
  <div class="col" style="flex:1"><div style="height:72px;border-radius:8px;background:var(--ink-3)"></div><div class="val">ink-3 #857f80</div></div>
  <div class="col" style="flex:1"><div style="height:72px;border-radius:8px;background:var(--ink-4)"></div><div class="val">ink-4 #a8a2a3</div></div>
  <div class="col" style="flex:1"><div style="height:72px;border-radius:8px;background:var(--line-strong)"></div><div class="val">line-strong</div></div>
  <div class="col" style="flex:1"><div style="height:72px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)"></div><div class="val">surface-2</div></div>
</div>
<div style="margin-top:14px;font-family:var(--font-body);font-size:13px;color:var(--ink-3)">Warm-tinted neutral ramp — headings → body → captions → placeholder → borders. Never pure gray.</div>
</body></html>
