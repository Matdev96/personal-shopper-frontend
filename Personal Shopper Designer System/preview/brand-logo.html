<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="row" style="align-items:center;gap:30px">
  <div class="col" style="align-items:center;gap:8px">
    <div style="width:72px;height:72px;border-radius:14px;background:var(--charcoal);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:34px">PS</div>
    <div class="val">monogram · charcoal/gold</div>
  </div>
  <div class="col" style="align-items:center;gap:8px">
    <div style="width:72px;height:72px;border-radius:14px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:34px">PS</div>
    <div class="val">gold inverse</div>
  </div>
  <div style="width:1px;align-self:stretch;background:var(--line)"></div>
  <div class="col" style="gap:4px">
    <div style="font-family:var(--font-display);font-weight:600;font-size:30px;color:var(--ink-1)">Personal Shopper</div>
    <div style="font-family:var(--font-body);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep)">Importados · Sob Medida</div>
    <div class="val" style="margin-top:6px">Wordmark — Playfair Display 600</div>
  </div>
</div>
</body></html>
