<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>.ico{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-1)}.ico .val{font-size:10px}</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script></head>
<body>
<div class="row" style="gap:22px">
  <div class="ico"><i data-lucide="shopping-bag"></i><span class="val">shopping-bag</span></div>
  <div class="ico"><i data-lucide="search"></i><span class="val">search</span></div>
  <div class="ico"><i data-lucide="user"></i><span class="val">user</span></div>
  <div class="ico"><i data-lucide="shopping-cart"></i><span class="val">cart</span></div>
  <div class="ico"><i data-lucide="package"></i><span class="val">package</span></div>
  <div class="ico"><i data-lucide="truck"></i><span class="val">truck</span></div>
  <div class="ico"><i data-lucide="layout-dashboard"></i><span class="val">dashboard</span></div>
  <div class="ico"><i data-lucide="wallet"></i><span class="val">wallet</span></div>
  <div class="ico"><i data-lucide="clock"></i><span class="val">clock</span></div>
  <div class="ico"><i data-lucide="heart"></i><span class="val">heart</span></div>
  <div class="ico"><i data-lucide="chevron-right"></i><span class="val">chevron</span></div>
</div>
<div style="margin-top:16px;font-family:var(--font-body);font-size:13px;color:var(--ink-3)">Lucide — 2px stroke, line-only, <span class="mono">currentColor</span> (charcoal default, gold on active). Replaces the source admin's emoji.</div>
<script>lucide.createIcons();</script>
</body></html>
