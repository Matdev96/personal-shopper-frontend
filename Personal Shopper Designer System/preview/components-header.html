<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>body{padding:0;background:var(--bg)}
.hdr{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:space-between;padding:14px 26px}
.brand{display:flex;align-items:center;gap:10px}
.mono{width:38px;height:38px;border-radius:9px;background:var(--charcoal);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:17px}
.word{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink-1)}
nav{display:flex;gap:26px;font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--ink-2)}
nav a.active{color:var(--gold-deep);font-weight:600}
.acts{display:flex;align-items:center;gap:18px;color:var(--ink-1)}
.cart{position:relative}
.dot{position:absolute;top:-6px;right:-7px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;font-family:var(--font-body);width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center}
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script></head>
<body>
<div class="hdr">
  <div class="brand"><div class="mono">PS</div><span class="word">Personal Shopper</span></div>
  <nav><a class="active">Home</a><a>Produtos</a><a>Pedidos</a><a>Solicitações</a></nav>
  <div class="acts"><span class="cart"><i data-lucide="shopping-bag"></i><span class="dot">3</span></span><i data-lucide="user"></i></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
